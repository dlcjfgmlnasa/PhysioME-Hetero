# Ablation M1 (variant: 3-modal). Modality scale-up curve: this is the
# minimal cardiovascular trio (ABP/ECG/PPG, all ~99% prevalence). Bucket
# count = 2^3 - 1 = 7. Single-group decoder degenerates (no respiratory
# modality) but the hetero-availability training machinery still applies
# via synth-drop within the 3-modal set.
# Compare against m1_4modal (+CVP), m1_5modal (+CO2), and the 6-modal
# baseline (physiome_hetero.yaml).
# Train with: python -m pretrained.physiome.train_hetero --config_yaml config/vital_db/physiome_hetero_m1_3modal.yaml

ssl_data_dir: '/home/coder/workspace/updown/physiome_hetero_v2/train'

holdout_subjects_file: null

probe_subjects_file: null
probe_downstream_dir: null
probe_every: 1

modality_name2path:
  'ABP': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/neuronet/ABP/model/best_model.pth'
  'ECG': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/neuronet/ECG/model/best_model.pth'
  'PPG': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/neuronet/PPG/model/best_model.pth'

sfreq: 100
rfreq: 100
data_scaler: false
class_downsampling: true

dataloader_eager: false
dataloader_normalize: true
shard_cache_size: 4

bucket_sampling: 'natural'
bucket_min_size: 128

train_epochs: 50
train_warmup_epoch: 1
train_base_learning_rate: 0.0001
train_batch_size: 128
train_batch_accumulation: 1
num_workers: 4

second: 60
time_window: 3
time_step: 3
backbone_embed_dim: 512
backbone_num_frames: 20
encoder_embed_dim: 512
encoder_heads: 8
encoder_depths: 4
decoder_embed_dim: 256
decoder_heads: 8
decoder_depths: 3
decoder_recon_depths: 8

# All three modalities are cardiovascular — only one decoder group will
# materialize in practice.
modal_to_group:
  ABP: cardiovascular
  ECG: cardiovascular
  PPG: cardiovascular

projection_hidden:
  - 1024
  - 512
temperature: 0.1
mask_ratio: 0.4

lora_r: 4
lora_alpha: 16
lora_dropout: 0.05

restoration_only_on_complete: true

probe_max_subsets: 15

print_point: 20
ckpt_path: '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/'
model_name: 'physiome_hetero_m1_3modal'
seed: 777
