# Ablation A4 (variant: single-group). modal_to_group = all-in-one, so a
# single decoder body is shared across all 6 modalities; per-modal heads
# stay distinct. Maximally aggressive sharing — opposite end of the A4
# axis from per-modal. Tests whether the 2-group physiology split adds
# any inductive bias beyond pure parameter sharing.
# All other settings identical to physiome_hetero.yaml.
# Train with: python -m pretrained.physiome.train_hetero --config_yaml config/vital_db/physiome_hetero_a4_single.yaml

ssl_data_dir: '/home/coder/workspace/updown/physiome_hetero_v2/train'

holdout_subjects_file: null

probe_subjects_file: null
probe_downstream_dir: null
probe_every: 1

modality_name2path:
  'ABP': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/neuronet/ABP/model/best_model.pth'
  'ECG': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/neuronet/ECG/model/best_model.pth'
  'PPG': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/neuronet/PPG/model/best_model.pth'
  'CVP': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/neuronet/CVP/model/best_model.pth'
  'CO2': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/neuronet/CO2/model/best_model.pth'
  'AWP': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/neuronet/AWP/model/best_model.pth'

sfreq: 100
rfreq: 100
data_scaler: false
class_downsampling: true

dataloader_eager: false
dataloader_normalize: true
shard_cache_size: 4

bucket_sampling: 'natural'
bucket_min_size: 128

train_epochs: 50
train_warmup_epoch: 1
train_base_learning_rate: 0.0001
train_batch_size: 128
train_batch_accumulation: 1
num_workers: 4

second: 60
time_window: 3
time_step: 3
backbone_embed_dim: 512
backbone_num_frames: 20
encoder_embed_dim: 512
encoder_heads: 8
encoder_depths: 4
decoder_embed_dim: 256
decoder_heads: 8
decoder_depths: 3
decoder_recon_depths: 8

# A4 ablation: single shared group (all 6 modalities → one decoder body).
# Tests whether physiology-aware grouping > naive full sharing.
modal_to_group:
  ABP: all
  ECG: all
  PPG: all
  CVP: all
  CO2: all
  AWP: all

projection_hidden:
  - 1024
  - 512
temperature: 0.1
mask_ratio: 0.4

lora_r: 4
lora_alpha: 16
lora_dropout: 0.05

restoration_only_on_complete: true

probe_max_subsets: 15

print_point: 20
ckpt_path: '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/'
model_name: 'physiome_hetero_a4_single'
seed: 777
