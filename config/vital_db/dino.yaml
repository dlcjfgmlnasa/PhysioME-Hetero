# Phase-1 unimodal SSL via DINOv3-style self-distillation
# (BiosignalDINO). Train one modality at a time via --ch_idx.

ssl_data_dir: '/home/coder/workspace/updown/physiome_hetero_v2/train'

# Subject-level holdout for downstream evaluation. CLI override available.
holdout_subjects_file: null

# Optional dev-cohort linear probing (disjoint from holdout/test). Per-modality
# task dispatch is in pretrained/probe_dev_data.PHASE1_PROBE_TASK_FOR_MODAL.
probe_downstream_dir: null
probe_subjects_file: null
probe_every: 1

ch_names:
  - 'ABP'
  - 'ECG'
  - 'PPG'
  - 'CVP'
  - 'CO2'
  - 'AWP'
ch_idx: 0

# DataLoader.
sfreq: 100
rfreq: 100
data_scaler: false
class_downsampling: true
dataloader_normalize: true
shard_cache_size: 2
num_workers: 8
prefetch_factor: 4

# Shard-level train/val/eval split.
val_shard_ratio: 0.1
eval_shard_ratio: 0.1

# Optimisation.
train_epochs: 50
train_warmup_epoch: 1
train_base_learning_rate: 0.0001
train_batch_size: 256
train_batch_accumulation: 1
weight_decay: 0.04
clip_grad: 3.0

# Backbone (kept identical to the prior NeuroNet encoder so Phase-2 can
# transfer the encoder state-dict without changes).
second: 60
time_window: 3
time_step: 3
encoder_embed_dim: 512
encoder_heads: 8
encoder_depths: 6

# Register / storage tokens (Darcet et al. 2024, "Vision Transformers Need
# Registers"). Architectural-only — never enter any SSL loss; the encoder
# uses them as a scratchpad so it stops repurposing low-information patch
# tokens (flatlines, baseline, expiration plateaus) as global-info hubs.
# DINOv3 ViT-7B uses 4; default 0 here for backward compat.
n_storage_tokens: 4

# DINO head (CLS-level prototype assignment).
# K=1024 is sized to our single-GPU batch=256 so SK has B/K=0.25 (the
# reference DINOv3 keeps B/K ~0.5 via 32k effective DDP batch; B/K<0.1
# makes SK ill-conditioned). With K=8192 we had B/K=0.03 which is why
# the dino loss was barely moving in the first smoke run.
dino_head_hidden_dim: 2048
dino_head_bottleneck_dim: 256
dino_head_n_prototypes: 1024
dino_head_n_layers: 3

# iBOT head — SEPARATE instance (DINOv3 mandates ibot.separate_head=true).
# K=4096 because iBOT's effective batch is ~10x larger than DINO's: each
# batch contributes batch_size * n_masked_patches * n_global crops masked
# patches (~256 * 5 * 2 ~ 2,560), so B/K ~0.6 — well-conditioned for SK.
ibot_head_hidden_dim: 2048
ibot_head_bottleneck_dim: 256
ibot_head_n_prototypes: 4096
ibot_head_n_layers: 3

# Multi-crop. global_samples must be <= sfreq * second; local <= global.
n_global: 2
n_local: 8
global_samples: 6000     # 60 s @ 100 Hz
local_samples: 1500      # 15 s @ 100 Hz

# Self-distillation temps + schedules.
student_temp: 0.1
teacher_temp_start: 0.04
teacher_temp_end: 0.07
teacher_temp_warmup_epochs: 30
ema_momentum_start: 0.992
ema_momentum_end: 1.0

# DINOv3-style stability: zero the prototype-layer LR for this many epochs
# at the start of training. Replaces the v1/v2 weight_norm magnitude freeze.
freeze_last_layer_epochs: 1

# iBOT block masking (BEiT-style). mask_ratio is drawn per-crop from
# [min, max]; mask_sample_probability sets the FRACTION of crops that get
# a non-empty mask. The rest get all-False and contribute 0 to the iBOT
# loss but still count in the denominator (matches the reference).
ibot_weight: 1.0
ibot_mask_ratio_min: 0.1
ibot_mask_ratio_max: 0.5
ibot_mask_sample_probability: 0.5
ibot_min_block_size: 1
dino_weight: 1.0

# Sinkhorn-Knopp iterations for teacher centering (reference: 3).
sinkhorn_n_iters: 3

# CLS-attention heatmap viz. Saves a PNG every ``viz_every`` epochs to
# <ckpt>/<MODAL>/logs/attn/epoch_NNN.png showing CLS-to-patch attention
# weights from the last student encoder layer, overlaid on a fixed set
# of val-loader waveforms. 0 disables.
viz_every: 5
viz_batch_size: 4

print_point: 20
# Save path: <ckpt_path>/<model_name>/<MODAL>/model/{best,last}_model.pth.
ckpt_path: '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/'
model_name: 'dino'
