# Phase-1 NeuroNet (TF-C) pretraining — single modality at a time.
# Reads sharded SSL data produced by dataset/data_parser/vital_db_ssl.py.

ssl_data_dir: '/home/coder/workspace/updown/physiome_hetero_v2/train'

# Subject-level holdout for downstream evaluation. If set, listed case_ids
# are excluded from Phase-1 SSL training. Generated by:
#   python -m dataset.data_parser.build_case_index --data_dir <ssl_data_dir>
#   python -m dataset.data_parser.sample_holdout --data_dir <ssl_data_dir>
# Set to null (or remove) to skip exclusion. CLI override: --holdout_subjects_file.
holdout_subjects_file: null

# Optional dev-cohort linear probing (disjoint from holdout/test). When both
# probe_downstream_dir and probe_subjects_file are set, every probe_every
# epochs the trainer extracts unimodal latents on the dev cohort, fits a
# LogisticRegression on IOH labels, and logs AUROC + macro-F1.
probe_downstream_dir: null               # vitaldb_downstream npz dir
probe_subjects_file: null                # e.g. <ssl_data_dir>/dev_case_ids.json
probe_every: 1                           # 1 = every epoch

# Reconstruction-quality visualization. Saves a real-vs-recon waveform PNG
# every N epochs on a fixed 4-sample slice of the val loader. Output path:
#   <ckpt_path>/<model_name>/<modal>/logs/recon/epoch_NNN.png
# Set viz_every=0 to disable.
#
# viz_mask_ratio decouples the visualization from the training mask_ratio
# (which is intentionally aggressive at 0.8 for MAE supervision). 0.5 leaves
# half the patches visible so the eye can compare unmasked context vs the
# decoder's prediction on masked patches without the figure being dominated
# by gold blocks.
viz_every: 5
viz_mask_ratio: 0.5

ch_names:
  - 'ABP'
  - 'ECG'
  - 'PPG'
  - 'CVP'
  - 'CO2'
  - 'AWP'
# which channel index this run trains
# (0=ABP, 1=ECG, 2=PPG, 3=CVP, 4=CO2, 5=AWP) — override on the CLI per modality.
ch_idx: 2

sfreq: 100
rfreq: 100
data_scaler: false
class_downsampling: true

# DataLoader (sharded reader).
# When shards live on a slow filesystem (network drive), the trainer uses
# ShardSequentialSampler so each shard is loaded exactly once per epoch and
# persistent_workers + prefetch_factor hide the network read behind GPU
# compute. shard_cache_size of 1 is sufficient under sequential sampling
# (worker chews through one shard before opening the next); bump to 2-4 to
# absorb prefetch overlap.
dataloader_normalize: true
shard_cache_size: 2
num_workers: 8
prefetch_factor: 4

# Shard-level split (parser writes shards in case-arrival order ->
# contiguous slices are approximately subject-disjoint).
val_shard_ratio: 0.1
eval_shard_ratio: 0.1

train_epochs: 30
train_warmup_epoch: 1
train_base_learning_rate: 0.0001
train_batch_size: 256
train_batch_accumulation: 1

second: 60
time_window: 3
time_step: 3
encoder_embed_dim: 512
encoder_heads: 8
encoder_depths: 6
decoder_embed_dim: 256
decoder_heads: 8
decoder_depths: 4
projection_hidden:
  - 1024
  - 512
temperature: 0.1
mask_ratio: 0.8

print_point: 20
# Phase-1 ckpt root. With model_name='neuronet' the per-modality save path
# becomes <ckpt_path>/neuronet/<MODAL>/model/best_model.pth.
ckpt_path: '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/'
model_name: 'neuronet'
