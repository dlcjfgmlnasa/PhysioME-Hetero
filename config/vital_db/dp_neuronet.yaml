# Phase-1 unimodal SSL via DINOv3-style self-distillation
# (replaces the prior NeuroNet TF-C recipe). Train one modality at a time
# via --ch_idx (0=ABP, 1=ECG, 2=PPG, 3=CVP, 4=CO2, 5=AWP).

ssl_data_dir: '/home/coder/workspace/updown/physiome_hetero_v2/train'

# Subject-level holdout for downstream evaluation. CLI override available.
holdout_subjects_file: null

# Optional dev-cohort linear probing (disjoint from holdout/test). Per-modality
# task dispatch is in pretrained/probe_dev_data.PHASE1_PROBE_TASK_FOR_MODAL.
probe_downstream_dir: null
probe_subjects_file: null
probe_every: 1

ch_names:
  - 'ABP'
  - 'ECG'
  - 'PPG'
  - 'CVP'
  - 'CO2'
  - 'AWP'
ch_idx: 0

# DataLoader.
sfreq: 100
rfreq: 100
data_scaler: false
class_downsampling: true
dataloader_normalize: true
shard_cache_size: 2
num_workers: 8
prefetch_factor: 4

# Shard-level train/val/eval split.
val_shard_ratio: 0.1
eval_shard_ratio: 0.1

# Optimisation.
train_epochs: 50
train_warmup_epoch: 1
train_base_learning_rate: 0.0001
train_batch_size: 256
train_batch_accumulation: 1
weight_decay: 0.04
clip_grad: 3.0

# Backbone architecture (kept identical to the prior NeuroNet encoder so
# Phase-2 can transfer the encoder state-dict without changes).
second: 60
time_window: 3
time_step: 3
encoder_embed_dim: 512
encoder_heads: 8
encoder_depths: 6

# DINO head.
head_hidden_dim: 2048
head_bottleneck_dim: 256
head_n_prototypes: 8192
head_n_layers: 3

# Multi-crop. local_samples must be <= global_samples <= sfreq * second.
n_global: 2
n_local: 6
global_samples: 6000     # 60 s @ 100 Hz
local_samples: 1500      # 15 s @ 100 Hz

# Self-distillation.
student_temp: 0.1
teacher_temp_start: 0.04
teacher_temp_end: 0.07
teacher_temp_warmup_epochs: 5
ema_momentum_start: 0.994
ema_momentum_end: 1.0
center_momentum: 0.9

# iBOT (patch-level prediction). Set ibot_weight=0 to disable.
ibot_weight: 1.0
ibot_mask_ratio: 0.3
dino_weight: 1.0

print_point: 20
# Save path: <ckpt_path>/<model_name>/<MODAL>/model/best_model.pth + last_model.pth.
ckpt_path: '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/'
model_name: 'neuronet'   # legacy dir name; ckpt schema below is 'dinov3'.
