# PhysioME-Hetero pretraining config for VitalDB.
# Reads SSL pretraining data from ``ssl_data_dir`` (output of
# dataset/data_parser/vital_db_ssl.py) and runs per-epoch linear probing
# on the dev cohort (case_ids in ``probe_subjects_file``) windowed via
# ``downstream/tasks/hypotension.py`` for the IOH task.

ssl_data_dir: '/home/coder/workspace/updown/physiome_hetero/train'

# Subject-level holdout for downstream evaluation. Same list must be used
# for Phase-1 (dp_neuronet.yaml) and downstream evaluators -- otherwise
# subjects leak across stages. See dataset/data_parser/{build_case_index,
# sample_holdout}.py.
holdout_subjects_file: null

# Dev-cohort linear probing (disjoint from holdout/test). Set both to a
# valid path to enable per-epoch probing; leave null to skip.
probe_subjects_file: null                # e.g. <ssl_data_dir>/dev_case_ids.json
probe_downstream_dir: null               # vitaldb_downstream npz dir
probe_every: 1                           # run probe every N epochs

# Backbone unimodal checkpoints (same as the original physiome.yaml).
# 6-modal hetero (Step 3, 2026-05-09): + CO2 (capnography, ~80% prevalence)
# and + AWP (airway pressure, ~50%) round out the cardio-pulmonary modality
# set. Theoretical bucket count rises to 63, but realistic active buckets
# are far fewer (~8) because availability follows clinical phenotype
# (anesthesia / mechanical-ventilation / central-line) rather than uniform
# random.
modality_name2path:
  'ABP': '/home/coder/workspace/updown/physiome_hetero/ckpt/neuronet/ABP/model/best_model.pth'
  'ECG': '/home/coder/workspace/updown/physiome_hetero/ckpt/neuronet/ECG/model/best_model.pth'
  'PPG': '/home/coder/workspace/updown/physiome_hetero/ckpt/neuronet/PPG/model/best_model.pth'
  'CVP': '/home/coder/workspace/updown/physiome_hetero/ckpt/neuronet/CVP/model/best_model.pth'
  'CO2': '/home/coder/workspace/updown/physiome_hetero/ckpt/neuronet/CO2/model/best_model.pth'
  'AWP': '/home/coder/workspace/updown/physiome_hetero/ckpt/neuronet/AWP/model/best_model.pth'

# Signal config.
sfreq: 100
rfreq: 100
data_scaler: false
class_downsampling: true

# DataLoader behaviour.
dataloader_eager: false      # set true if all SSL shards comfortably fit in RAM
dataloader_normalize: true
shard_cache_size: 4          # number of shards held in lazy LRU cache per worker

# Bucket-aware sampler.
bucket_sampling: 'natural'   # 'natural' (proportional to bucket size) or 'uniform'
bucket_min_size: 128         # buckets smaller than this are dropped (cannot fill a batch)

# Optimisation.
train_epochs: 50
train_warmup_epoch: 1
train_base_learning_rate: 0.0001
train_batch_size: 128
train_batch_accumulation: 1
num_workers: 4

# Architecture (matches the original physiome.yaml so that A1 baseline is comparable).
second: 60
time_window: 3
time_step: 3
backbone_embed_dim: 512
backbone_num_frames: 20
encoder_embed_dim: 512
encoder_heads: 8
encoder_depths: 4
decoder_embed_dim: 256
decoder_heads: 8
decoder_depths: 3
decoder_recon_depths: 8
projection_hidden:
  - 1024
  - 512
temperature: 0.1
mask_ratio: 0.4

# LoRA on the unimodal backbones.
lora_r: 4
lora_alpha: 16
lora_dropout: 0.05

# Hetero / availability-aware knobs (also used as ablation toggles).
# True  -> v1 recipe: restoration loss only on fully-real-present batches.
# False -> ablation A3: restoration on any batch with >=2 real-present modals;
#          synth-drop one or more, naturally-absent slots get encoder context
#          via dropped_modality_token but contribute zero loss.
restoration_only_on_complete: true

# Probe efficiency knob (probe_utils.select_probe_subsets). N=6 -> 63
# subsets, capped per epoch with full-set + each single-modal always
# included. Probe runs only on modalities the downstream npz can produce
# (= probe_modalities in train_hetero.PROBE_MODALITIES, currently
# ABP/ECG/PPG), so the practical subset count is bounded by 2^3-1 = 7.
probe_max_subsets: 15

print_point: 20
# Phase-2 ckpt root (same parent as Phase-1; model_name keeps them separate).
# Save path: <ckpt_path>/physiome_hetero/...
ckpt_path: '/home/coder/workspace/updown/physiome_hetero/ckpt/'
model_name: 'physiome_hetero'
seed: 777
