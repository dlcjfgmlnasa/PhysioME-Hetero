# Ablation A4 (variant: morphology). modal_to_group based on waveform
# morphology rather than physiology:
#   pulsatile   : ABP / PPG / CVP  (mechanical pressure/volume waves)
#   electrical  : ECG               (depolarisation waveforms)
#   respiratory : CO2 / AWP         (gas concentration + airway pressure)
# Tests whether morphology-based grouping (waveform-feature affinity) is a
# stronger inductive bias than cardiac/respiratory physiology grouping.
# Note: 'electrical' is a single-modal group, so ECG effectively gets its
# own decoder body — that is the intended ablation behaviour.
# All other settings identical to physiome_hetero.yaml.
# Train with: python -m pretrained.physiome.train_hetero --config_yaml config/vital_db/physiome_hetero_a4_morphology.yaml

ssl_data_dir: '/home/coder/workspace/updown/physiome_hetero_v2/train'

holdout_subjects_file: null

probe_subjects_file: null
probe_downstream_dir: null
probe_every: 1

modality_name2path:
  'ABP': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/dino/ABP/model/best_model.pth'
  'ECG': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/dino/ECG/model/best_model.pth'
  'PPG': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/dino/PPG/model/best_model.pth'
  'CVP': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/dino/CVP/model/best_model.pth'
  'CO2': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/dino/CO2/model/best_model.pth'
  'AWP': '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/dino/AWP/model/best_model.pth'

sfreq: 100
rfreq: 100
data_scaler: false
class_downsampling: true

dataloader_eager: false
dataloader_normalize: true
shard_cache_size: 4

bucket_sampling: 'natural'
bucket_min_size: 128

train_epochs: 50
train_warmup_epoch: 1
train_base_learning_rate: 0.0001
train_batch_size: 128
train_batch_accumulation: 1
num_workers: 4

second: 60
time_window: 3
time_step: 3
backbone_embed_dim: 512
backbone_num_frames: 20
encoder_embed_dim: 512
encoder_heads: 8
encoder_depths: 4
decoder_embed_dim: 256
decoder_heads: 8
decoder_depths: 3
decoder_recon_depths: 8

# A4 ablation: morphology-based 3-group decoder.
modal_to_group:
  ABP: pulsatile
  PPG: pulsatile
  CVP: pulsatile
  ECG: electrical
  CO2: respiratory
  AWP: respiratory

projection_hidden:
  - 1024
  - 512
temperature: 0.1
mask_ratio: 0.4

lora_r: 4
lora_alpha: 16
lora_dropout: 0.05

restoration_only_on_complete: true

probe_max_subsets: 15

print_point: 20
ckpt_path: '/home/coder/workspace/updown/physiome_hetero_v2/ckpt/'
model_name: 'physiome_hetero_a4_morphology'
seed: 777
